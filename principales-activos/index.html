<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Principales Activos · Club de Inversionistas</title>
<style>
  :root{
    --navy:#1f3a93;
    --navy-dark:#16285f;
    --ink:#1a1a1a;
    --desc:#c0561f;
    --grid:#cfd3d7;
    --bg:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",Roboto,Arial,Helvetica,sans-serif;
    font-size:13px;
  }
  .wrap{max-width:900px; margin:0 auto; padding:14px}
  .top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    margin-bottom:14px;
  }
  .title-block{flex:1}
  .title-main{
    background:var(--navy); color:#fff; text-align:center; font-weight:700;
    padding:6px 8px; letter-spacing:.3px;
  }
  .title-date{
    background:#2e5bd6; color:#fff; text-align:center; font-weight:600;
    padding:3px 8px; font-size:12px;
  }
  .logo{
    text-align:right; line-height:1; font-weight:800; letter-spacing:1px;
    color:#111;
  }
  .logo b{font-size:26px}
  .logo span{display:block; font-size:9px; color:#c0392b; letter-spacing:2px; font-weight:700}

  table{border-collapse:collapse; width:100%; table-layout:fixed}
  th,td{border:1px solid var(--grid); padding:2px 6px; white-space:nowrap; overflow:hidden}
  thead th{font-size:11px; letter-spacing:.4px}

  table.principales th{background:#e9ecef; color:#222; text-transform:uppercase; text-align:center}
  .principales td.ticker{font-weight:700; text-align:left}
  .principales td.nombre{font-weight:600; color:var(--desc); text-align:left; text-overflow:ellipsis}
  .principales td.num{text-align:center; font-weight:600}

  .muted{color:#888; text-align:center; font-size:11px; padding:6px}

  @media (max-width:820px){ .top{flex-direction:column} .logo{text-align:left} }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="title-block">
      <div class="title-main">Principales Activos</div>
      <div class="title-date" id="fecha">—</div>
    </div>
    <div class="logo"><b>CLUB</b><span>DE INVERSIONISTAS</span></div>
  </div>

  <table class="principales">
    <thead>
      <tr>
        <th style="width:16%">Ticker</th>
        <th style="width:34%">Nombre</th>
        <th style="width:12.5%">High 52</th>
        <th style="width:12.5%">YTD</th>
        <th style="width:12.5%">Mes</th>
        <th style="width:12.5%">Semana</th>
        <th style="width:12.5%">Día</th>
      </tr>
    </thead>
    <tbody id="principales-body"></tbody>
  </table>

</div>

<script>
/* =========================================================================
   1) FUENTE DE DATOS
   ========================================================================= */
async function loadData(){
  try{
    const res = await fetch('/.netlify/functions/sheets');
    if(res.ok){
      const data = await res.json();
      if(data && Array.isArray(data.principales) && data.principales.length) return data;
    }
  }catch(e){ /* sin backend: caemos a la muestra */ }
  return SAMPLE;
}

/* =========================================================================
   2) ESCALA DE COLOR
   Variación en % con saturación relativa a la columna (como el formato
   condicional de Excel por columna): cap = mayor magnitud absoluta de esa columna.
   ========================================================================= */
function colorPctRel(v, cap){
  v = Number(v);
  if (!isFinite(v) || v === 0) return '#ffffff';
  cap = cap || 1;
  const mag = Math.min(Math.abs(v), cap) / cap;
  const light = 96 - mag*26;
  const hue = v > 0 ? 130 : 0;
  return `hsl(${hue} 55% ${light}%)`;
}
function fmtPct(v){ return v==null ? '' : (v>0?'+':'') + v.toFixed(2) + '%'; }

/* =========================================================================
   3) RENDER
   ========================================================================= */
function renderPrincipales(rows){
  const body = document.getElementById('principales-body');
  body.innerHTML = '';

  const cols = ['high52','ytd','mes','semana','dia'];
  const caps = {};
  cols.forEach(c => { caps[c] = Math.max(1, ...rows.map(r => Math.abs(r[c] || 0))); });

  let lastGrupo = null;
  const bandas = { activos: 'PRINCIPALES ACTIVOS', sectores: 'SECTORES S&P 500' };
  rows.forEach(r=>{
    if(r.grupo !== lastGrupo){
      const band = document.createElement('tr');
      band.innerHTML = `<td colspan="7" style="background:var(--navy-dark);color:#fff;text-align:center;font-weight:700;padding:4px">${bandas[r.grupo] || r.grupo}</td>`;
      body.appendChild(band);
      lastGrupo = r.grupo;
    }
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="ticker">${r.ticker}</td>
      <td class="nombre" title="${r.nombre}">${r.nombre}</td>
      ${cols.map(c => `<td class="num" style="background:${colorPctRel(r[c], caps[c])}">${fmtPct(r[c])}</td>`).join('')}`;
    body.appendChild(tr);
  });
}

(async function init(){
  const data = await loadData();
  document.getElementById('fecha').textContent = data.fecha || '';
  renderPrincipales(data.principales);
})();

</script>
