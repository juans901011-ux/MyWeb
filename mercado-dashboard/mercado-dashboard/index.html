<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Descripción diaria del mercado · Club de Inversionistas</title>
<style>
  :root{
    --navy:#1f3a93;
    --navy-dark:#16285f;
    --black:#111;
    --red:#c0392b;
    --ink:#1a1a1a;
    --desc:#c0561f;            /* naranja de la columna DESCRIPCIÓN */
    --border:#9aa0a6;
    --grid:#cfd3d7;
    --bg:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Segoe UI",Roboto,Arial,Helvetica,sans-serif;
    font-size:13px;
  }
  .wrap{max-width:1240px; margin:0 auto; padding:14px}
  .top{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px;
    margin-bottom:8px;
  }
  .title-block{flex:1}
  .title-main{
    background:var(--navy); color:#fff; text-align:center; font-weight:700;
    padding:6px 8px; letter-spacing:.3px;
  }
  .title-date{
    background:#2e5bd6; color:#fff; text-align:center; font-weight:600;
    padding:3px 8px; font-size:12px;
  }
  .logo{
    text-align:right; line-height:1; font-weight:800; letter-spacing:1px;
    color:#111;
  }
  .logo b{font-size:26px}
  .logo span{display:block; font-size:9px; color:#c0392b; letter-spacing:2px; font-weight:700}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start}

  table{border-collapse:collapse; width:100%; table-layout:fixed}
  th,td{border:1px solid var(--grid); padding:2px 6px; white-space:nowrap; overflow:hidden}
  thead th{font-size:11px; letter-spacing:.4px}

  /* ---- Panel izquierdo: FUERZA RELATIVA ---- */
  .band{
    background:var(--navy-dark); color:#fff; text-align:center; font-weight:700;
    border:1px solid var(--navy-dark); padding:4px;
  }
  .fr th{background:#e9ecef; color:#222; text-transform:uppercase}
  .fr td.ticker{font-weight:700; color:#111}
  .fr td.desc{color:var(--desc); font-weight:600; text-overflow:ellipsis}
  .fr td.spark{padding:1px 4px}
  .fr td.rs{text-align:center; font-weight:600; color:#1a1a1a}
  tr.sep td{border:0; height:7px; padding:0}

  /* ---- Panel derecho: POSICIÓN EN EL MERCADO ---- */
  .pos-head-pos{background:var(--black); color:#fff}
  .pos-head-var{background:var(--red); color:#fff}
  .pos th{font-weight:700; text-transform:uppercase}
  .pos td.ticker{font-weight:700; text-align:left}
  .pos td.rs,.pos td.var{text-align:center; font-weight:600}
  .col-tick{width:22%}
  .col-rs{width:26%}
  .col-var{width:26%}

  .spark svg{display:block}
  .muted{color:#888; text-align:center; font-size:11px; padding:6px}

  /* ---- Pestañas ---- */
  .tabs{display:flex; gap:4px; margin-bottom:10px; border-bottom:2px solid var(--navy-dark)}
  .tab-btn{
    border:0; background:#e9ecef; color:#444; font-weight:700; font-size:12px;
    padding:7px 16px; cursor:pointer; border-radius:4px 4px 0 0; letter-spacing:.3px;
  }
  .tab-btn.active{background:var(--navy-dark); color:#fff}
  .tab-panel{display:none}
  .tab-panel.active{display:block}

  /* ---- Resumen (tabla ordenable) ---- */
  table.resumen{table-layout:fixed}
  .resumen th:nth-child(1), .resumen td:nth-child(1){width:3%}
  .resumen th:nth-child(2), .resumen td:nth-child(2){width:7%}
  .resumen th:nth-child(3), .resumen td:nth-child(3){width:19%}
  .resumen th:nth-child(n+4), .resumen td:nth-child(n+4){width:8.9%}
  .resumen th{
    background:#e9ecef; color:#222; text-transform:uppercase; text-align:center;
    cursor:pointer; user-select:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .resumen th:hover{background:#dbe0e4}
  .resumen th .arrow{font-size:9px; color:var(--navy); margin-left:2px}
  .resumen td{text-align:center; font-weight:600}
  .resumen td.num{text-align:center}
  .resumen td.ticker{font-weight:700; text-align:left}
  .resumen td.nombre{font-weight:600; color:var(--desc); text-align:left; text-overflow:ellipsis}
  .resumen td.idx{color:#888; font-weight:400; text-align:center}

  /* ---- RS Países: mismas reglas de .resumen pero con sus propios anchos de
     columna -- "Nivel"/"Moneda"/los precios necesitan mucho menos espacio que
     encabezados largos como "% vs 52W High", que se cortaban con el 8.9% parejo. */
  #paises-table th:nth-child(1), #paises-table td:nth-child(1){width:3%}
  #paises-table th:nth-child(2), #paises-table td:nth-child(2){width:7%}
  #paises-table th:nth-child(3), #paises-table td:nth-child(3){width:17%}
  #paises-table th:nth-child(4), #paises-table td:nth-child(4){width:5%}
  #paises-table th:nth-child(5), #paises-table td:nth-child(5){width:6%}
  #paises-table th:nth-child(6), #paises-table td:nth-child(6){width:7%}
  #paises-table th:nth-child(7), #paises-table td:nth-child(7){width:7%}
  #paises-table th:nth-child(8), #paises-table td:nth-child(8){width:7%}
  #paises-table th:nth-child(n+9), #paises-table td:nth-child(n+9){width:10.25%}

  /* barra de datos dentro de la celda (estilo "Data Bars" de Excel): la barra
     se posiciona absoluta e ignora el padding de la celda (llega hasta el borde),
     el texto queda encima y respeta el padding normal. */
  td.paisbar{position:relative}
  td.paisbar .bar-fill{position:absolute; top:2px; bottom:2px; opacity:.55; border-radius:2px}
  td.paisbar .bar-text{position:relative; z-index:1}

  /* ---- Mapa RS x Día (burbujas) ---- */
  .map-caption{font-size:11px; color:#666; margin-bottom:8px}
  .bubble-wrap{position:relative; width:100%}
  #bubble-svg{display:block; width:100%; height:560px}
  .bb-axis-line{stroke:var(--grid); stroke-width:1}
  .bb-grid-line{stroke:var(--grid); stroke-width:1; opacity:.5}
  .bb-ref-line{stroke:var(--red); stroke-width:1.5; stroke-dasharray:5 4}
  .bb-ref-label{fill:var(--red); font-size:10px; font-weight:700}
  .bb-axis-label{fill:#666; font-size:10px}
  .bb-axis-title{fill:#444; font-size:11px; font-weight:700}
  .bb-dot{stroke:#fff; stroke-width:1; cursor:pointer}
  .bb-dot:hover{stroke:var(--navy-dark); stroke-width:2}
  .bb-dot-label{font-size:9px; font-weight:700; fill:var(--ink); pointer-events:none}
  .bubble-tip{
    position:absolute; display:none; pointer-events:none; z-index:5;
    background:#1a1a1a; color:#fff; font-size:11px; line-height:1.5;
    padding:6px 9px; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.25);
    white-space:nowrap;
  }
  .bubble-tip b{color:#fff}
  .bubble-tip-comps{margin-top:6px; border-collapse:collapse; width:100%}
  .bubble-tip-comps th{color:#aaa; font-weight:400; text-align:right; padding:1px 0 2px 10px}
  .bubble-tip-comps th:first-child, .bubble-tip-comps td:first-child{text-align:left; padding-left:0}
  .bubble-tip-comps td{text-align:right; padding:1px 0 1px 10px}
  .bubble-tip-comps td.up{color:#4ade80}
  .bubble-tip-comps td.down{color:#f87171}

  @media (max-width:820px){ .grid2{grid-template-columns:1fr} .top{flex-direction:column} .logo{text-align:left} }
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="title-block">
      <div class="title-main">Descripción diaria del mercado</div>
      <div class="title-date" id="fecha">—</div>
    </div>
    <div class="logo"><b>CLUB</b><span>DE INVERSIONISTAS</span></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="sectores">% RS por sectores</button>
    <button class="tab-btn" data-tab="resumen">Resumen</button>
    <button class="tab-btn" data-tab="mapa">Mapa RS × Día</button>
    <button class="tab-btn" data-tab="paises">RS Países</button>
  </div>

  <div class="tab-panel active" id="tab-sectores">
  <div class="grid2">

    <!-- ============ FUERZA RELATIVA ============ -->
    <div>
      <div class="band">FUERZA RELATIVA</div>
      <table class="fr">
        <thead>
          <tr>
            <th style="width:18%">Ticker</th>
            <th style="width:42%">Descripción</th>
            <th style="width:22%">Gráfico</th>
            <th style="width:18%">RS_STS%</th>
          </tr>
        </thead>
        <tbody id="fr-body"></tbody>
      </table>
    </div>

    <!-- ============ POSICIÓN EN EL MERCADO ============ -->
    <div>
      <table class="pos">
        <thead>
          <tr>
            <th class="pos-head-pos col-tick" rowspan="2">Ticker</th>
            <th class="pos-head-pos col-rs" rowspan="2">RS_STS%</th>
            <th class="pos-head-var" colspan="2">Variación</th>
          </tr>
          <tr>
            <th class="pos-head-var">1W</th>
            <th class="pos-head-var">1M</th>
          </tr>
        </thead>
        <tbody id="pos-body"></tbody>
      </table>
    </div>

  </div>
  </div>

  <!-- ============ RESUMEN (ordenable) ============ -->
  <div class="tab-panel" id="tab-resumen">
    <table class="resumen" id="resumen-table">
      <thead>
        <tr id="resumen-head"></tr>
      </thead>
      <tbody id="resumen-body"></tbody>
    </table>
  </div>

  <!-- ============ MAPA RS x DÍA (burbujas) ============ -->
  <div class="tab-panel" id="tab-mapa">
    <div class="map-caption">Eje Y: RS_STS% &nbsp;·&nbsp; Eje X: variación del Día &nbsp;·&nbsp; línea punteada = RS 90%. Pasa el cursor sobre un punto para ver el detalle.</div>
    <div class="bubble-wrap" id="bubble-wrap">
      <svg id="bubble-svg"></svg>
      <div class="bubble-tip" id="bubble-tip"></div>
    </div>
  </div>

  <!-- ============ RS POR PAÍSES (ordenable) ============ -->
  <div class="tab-panel" id="tab-paises">
    <table class="resumen" id="paises-table">
      <thead>
        <tr id="paises-head"></tr>
      </thead>
      <tbody id="paises-body"></tbody>
    </table>
  </div>
</div>

<script>
/* =========================================================================
   1) FUENTE DE DATOS
   Por ahora usamos DATOS DE MUESTRA (abajo) para que confirmes el aspecto.
   Para conectar Google Sheets en vivo, reemplaza loadData() por un fetch()
   a tu Cloudflare Pages Function (ver functions/api/sheets.js y README).
   ========================================================================= */

async function loadData(){
  // Intenta datos en vivo desde la Pages Function; si no hay backend
  // (p.ej. abriendo el HTML directo), usa los datos de muestra.
  try{
    const res = await fetch('/api/sheets');
    if(res.ok){
      const data = await res.json();
      // Confía en los datos en vivo si la respuesta tiene la forma esperada,
      // aunque algún panel venga vacío (ej. si el Sheet tiene errores de fórmula
      // ese día) -- así nunca se cae silenciosamente a la muestra vieja fija.
      if(data && Array.isArray(data.fuerzaRelativa) && Array.isArray(data.posicion)){
        return data;
      }
    }
  }catch(e){ /* sin backend: caemos a la muestra */ }
  return SAMPLE;
}

/* =========================================================================
   2) ESCALAS DE COLOR
   ========================================================================= */

// RS 0..100  ->  rojo (0) -> amarillo (~50) -> verde (100)
function colorRS(v){
  v = Math.max(0, Math.min(100, Number(v)));
  const hue = v * 1.2;                 // 0=rojo, 60=amarillo, 120=verde
  const light = 88 - (Math.abs(v-50)/50)*16;  // un poco más vivo en extremos
  return `hsl(${hue} 60% ${light}%)`;
}

// Variación en pps: 0 = blanco, + = verde, - = rojo (intensidad por magnitud)
function colorPps(v){
  v = Number(v);
  if (v === 0) return '#ffffff';
  const mag = Math.min(Math.abs(v), 60) / 60;     // satura a ±60
  const light = 96 - mag*26;                       // 96% -> 70%
  const hue = v > 0 ? 130 : 0;
  return `hsl(${hue} 55% ${light}%)`;
}

// Variación en % con saturación relativa a la columna (como el formato
// condicional de Excel por columna): cap = mayor magnitud absoluta de esa columna.
function colorPctRel(v, cap){
  v = Number(v);
  if (!isFinite(v) || v === 0) return '#ffffff';
  cap = cap || 1;
  const mag = Math.min(Math.abs(v), cap) / cap;
  const light = 96 - mag*26;
  const hue = v > 0 ? 130 : 0;
  return `hsl(${hue} 55% ${light}%)`;
}

// Sparkline de barras verdes a partir de una serie numérica
function sparkline(serie){
  if(!serie || !serie.length) return '';
  const w = 150, h = 22, n = serie.length, gap = 1;
  const bw = (w - gap*(n-1)) / n;
  const max = Math.max(...serie), min = Math.min(...serie);
  const rng = (max - min) || 1;
  let bars = '';
  serie.forEach((val,i)=>{
    const bh = 3 + ((val - min)/rng) * (h-3);
    const x = i*(bw+gap);
    const y = h - bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="#2e9e4f" rx="0.5"/>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${bars}</svg>`;
}

/* =========================================================================
   3) RENDER
   ========================================================================= */

function pps(v){ const n=Number(v); return (n>0?'+':'') + n + ' pps'; }

function renderFR(rows){
  const body = document.getElementById('fr-body');
  body.innerHTML = '';
  let lastGroup = null;
  rows.forEach(r=>{
    const groupChanged = (lastGroup !== null && r.grupo !== undefined && r.grupo !== lastGroup);
    if(r.sep === true || groupChanged){
      const sep = document.createElement('tr');
      sep.className = 'sep';
      sep.innerHTML = '<td colspan="4"></td>';
      body.appendChild(sep);
    }
    lastGroup = r.grupo;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="ticker">${r.ticker}</td>
      <td class="desc" title="${r.desc}">${r.desc}</td>
      <td class="spark">${sparkline(r.serie)}</td>
      <td class="rs" style="background:${colorRS(r.rs)}">${r.rs}%</td>`;
    body.appendChild(tr);
  });
}

function renderPos(rows){
  const body = document.getElementById('pos-body');
  body.innerHTML = '';
  rows.sort((a,b)=> b.rs - a.rs);
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="ticker">${r.ticker}</td>
      <td class="rs" style="background:${colorRS(r.rs)}">${r.rs}%</td>
      <td class="var" style="background:${colorPps(r.w1)}">${pps(r.w1)}</td>
      <td class="var" style="background:${colorPps(r.m1)}">${pps(r.m1)}</td>`;
    body.appendChild(tr);
  });
}

// ---- Resumen: tabla ordenable por columna (como el filtro A-Z / Z-A de Excel) ----
const RESUMEN_COLS = [
  {key:'ticker',  label:'Ticker',     type:'text'},
  {key:'nombre',  label:'Nombre',     type:'text'},
  {key:'rs',      label:'RS_STS%',    type:'rs'},
  {key:'fromOpen',label:'From Open',  type:'pct'},
  {key:'dia',     label:'Día',        type:'pct'},
  {key:'semana',  label:'Semana',     type:'pct'},
  {key:'mes',     label:'Mes',        type:'pct'},
  {key:'ytd',     label:'YTD',        type:'pct'},
  {key:'yoy',     label:'YoY',        type:'pct'},
  {key:'w52h',    label:'52W High',   type:'pct'}
];

let resumenRows = [];
let resumenSort = {key:'rs', dir:-1};

function fmtPct(v){ return v==null ? '' : (v>0?'+':'') + v.toFixed(2) + '%'; }

function renderResumenHead(){
  const tr = document.getElementById('resumen-head');
  tr.innerHTML = '<th style="width:34px">#</th>' + RESUMEN_COLS.map(c=>{
    const active = resumenSort.key === c.key;
    const arrow = active ? (resumenSort.dir === 1 ? '▲' : '▼') : '';
    return `<th data-key="${c.key}">${c.label}${arrow ? ` <span class="arrow">${arrow}</span>` : ''}</th>`;
  }).join('');
  tr.querySelectorAll('th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      resumenSort.dir = (resumenSort.key === key) ? -resumenSort.dir : 1;
      resumenSort.key = key;
      renderResumen(resumenRows);
    });
  });
}

function renderResumen(rows){
  resumenRows = rows;
  renderResumenHead();

  const col = RESUMEN_COLS.find(c=>c.key===resumenSort.key);
  const sorted = [...rows].sort((a,b)=>{
    let av = a[resumenSort.key], bv = b[resumenSort.key];
    let cmp;
    if(col.type === 'text'){
      cmp = String(av||'').localeCompare(String(bv||''), 'es');
    } else {
      av = av==null ? -Infinity : av; bv = bv==null ? -Infinity : bv;
      cmp = av - bv;
    }
    return cmp * resumenSort.dir;
  });

  // saturación de color relativa al máximo absoluto de cada columna % (estilo Excel)
  const caps = {};
  RESUMEN_COLS.filter(c=>c.type==='pct').forEach(c=>{
    caps[c.key] = Math.max(1, ...rows.map(r=> Math.abs(r[c.key]||0)));
  });

  const body = document.getElementById('resumen-body');
  body.innerHTML = '';
  sorted.forEach((r,i)=>{
    const tr = document.createElement('tr');
    let cells = `<td class="idx">${i+1}</td>`;
    cells += `<td class="ticker">${r.ticker}</td>`;
    cells += `<td class="nombre" title="${r.nombre}">${r.nombre}</td>`;
    cells += `<td class="num" style="background:${r.rs!=null?colorRS(r.rs):'#fff'}">${r.rs!=null?r.rs+'%':''}</td>`;
    ['fromOpen','dia','semana','mes','ytd','yoy','w52h'].forEach(key=>{
      const v = r[key];
      cells += `<td class="num" style="background:${colorPctRel(v, caps[key])}">${fmtPct(v)}</td>`;
    });
    tr.innerHTML = cells;
    body.appendChild(tr);
  });
}

// ---- RS por países: tabla ordenable (mismo patrón que Resumen) ----
const PAISES_COLS = [
  {key:'ticker',  label:'Ticker',          type:'text'},
  {key:'etf',     label:'ETF',             type:'text'},
  {key:'nivel',   label:'Nivel',           type:'text',
    desc:'Qué tan avanzado/evolucionado está el mercado de este país (I = más desarrollado, VI = menos desarrollado).'},
  {key:'moneda',  label:'Moneda',          type:'text'},
  {key:'last',    label:'Último',          type:'num',
    desc:'Último precio de cierre del ETF.'},
  {key:'w52h',    label:'52W High',        type:'num',
    desc:'Precio más alto que alcanzó el ETF en las últimas 52 semanas.'},
  {key:'w52l',    label:'52W Low',         type:'num',
    desc:'Precio más bajo que alcanzó el ETF en las últimas 52 semanas.'},
  {key:'vsW52h',  label:'% vs 52W High',   type:'pct',
    desc:'Qué tan por debajo está el precio actual respecto a su máximo de 52 semanas. Más negativo = más lejos de su máximo.'},
  {key:'toW52h',  label:'% to 52W High',   type:'pct',
    desc:'Cuánto debe subir el precio actual (en %) para alcanzar su máximo de 52 semanas. Entre más bajo, más cerca está de su máximo.'},
  {key:'toW52l',  label:'% to 52W Low',    type:'pct',
    desc:'Cuánto ha subido el precio actual (en %) desde su mínimo de 52 semanas.'},
  {key:'dia',     label:'1D Chg%',         type:'pct',
    desc:'Variación porcentual del precio en la última sesión (1 día).'}
];

let paisesRows = [];
let paisesSort = {key:'vsW52h', dir:1};   // asc: más cerca de 0 (menos negativo) = más fuerte primero

function fmtNum(v){ return v==null ? '' : v.toFixed(2); }

// ---- barra de datos dentro de la celda (estilo "Data Bars" de Excel) ----
const BAR_GREEN = 'hsl(130 50% 55%)';
const BAR_RED = 'hsl(0 65% 58%)';
function barCell(v, cap, growLeft, color){
  if(v == null) return '';
  const pct = Math.max(0, Math.min(100, (Math.abs(v)/(cap||1))*100));
  const side = growLeft ? `right:0` : `left:0`;
  return `<div class="bar-fill" style="${side}; width:${pct.toFixed(1)}%; background:${color}"></div><span class="bar-text">${fmtPct(v)}</span>`;
}

function renderPaisesHead(){
  const tr = document.getElementById('paises-head');
  tr.innerHTML = '<th style="width:34px">#</th>' + PAISES_COLS.map(c=>{
    const active = paisesSort.key === c.key;
    const arrow = active ? (paisesSort.dir === 1 ? '▲' : '▼') : '';
    const title = c.desc ? ` title="${c.desc}"` : '';
    return `<th data-key="${c.key}"${title}>${c.label}${arrow ? ` <span class="arrow">${arrow}</span>` : ''}</th>`;
  }).join('');
  tr.querySelectorAll('th[data-key]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      paisesSort.dir = (paisesSort.key === key) ? -paisesSort.dir : 1;
      paisesSort.key = key;
      renderPaises(paisesRows);
    });
  });
}

function renderPaises(rows){
  paisesRows = rows;
  renderPaisesHead();

  const col = PAISES_COLS.find(c=>c.key===paisesSort.key);
  const sorted = [...rows].sort((a,b)=>{
    let av = a[paisesSort.key], bv = b[paisesSort.key];
    let cmp;
    if(col.type === 'text'){
      cmp = String(av||'').localeCompare(String(bv||''), 'es');
    } else {
      av = av==null ? -Infinity : av; bv = bv==null ? -Infinity : bv;
      cmp = av - bv;
    }
    return cmp * paisesSort.dir;
  });

  const caps = {};
  PAISES_COLS.filter(c=>c.type==='pct').forEach(c=>{
    caps[c.key] = Math.max(1, ...rows.map(r=> Math.abs(r[c.key]||0)));
  });

  const body = document.getElementById('paises-body');
  body.innerHTML = '';
  sorted.forEach((r,i)=>{
    const tr = document.createElement('tr');
    let cells = `<td class="idx">${i+1}</td>`;
    cells += `<td class="ticker">${r.ticker}</td>`;
    cells += `<td class="nombre" title="${r.etf}">${r.etf}</td>`;
    cells += `<td class="num">${r.nivel||''}</td>`;
    cells += `<td class="num">${r.moneda||''}</td>`;
    ['last','w52h','w52l'].forEach(key=>{
      cells += `<td class="num">${fmtNum(r[key])}</td>`;
    });
    ['vsW52h','toW52h','toW52l','dia'].forEach(key=>{
      const v = r[key];
      let color, growLeft;
      if(key === 'toW52h'){
        // "% to 52W High" siempre es positivo (cuánto falta para llegar al máximo):
        // chico = cerca de su máximo (bueno) y grande = lejos (malo). Escala roja-
        // amarilla-verde completa (como RS_STS%), no solo rojo/verde binario.
        const t = Math.max(0, Math.min(1, v / caps[key]));
        color = colorRS(100 - t*100);
        growLeft = false;
      } else {
        color = v >= 0 ? BAR_GREEN : BAR_RED;
        growLeft = v < 0;   // negativos: barra anclada a la derecha, crece hacia la izquierda
      }
      cells += `<td class="num paisbar">${barCell(v, caps[key], growLeft, color)}</td>`;
    });
    tr.innerHTML = cells;
    body.appendChild(tr);
  });
}

// ---- Mapa RS x Día: burbujas (SVG, sin librerías) ----
function niceStep(maxAbs){
  const raw = maxAbs / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw || 1)));
  const norm = raw / pow;
  return (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * pow;
}

function renderBubbleMap(rows, componentes){
  const svg = document.getElementById('bubble-svg');
  const wrap = document.getElementById('bubble-wrap');
  const tip = document.getElementById('bubble-tip');
  const data = rows.filter(r => r.rs != null && r.dia != null);
  svg.innerHTML = '';
  if(!data.length) return;

  const W = 1000, H = 540, mL = 46, mR = 16, mT = 70, mB = 44;
  const innerW = W - mL - mR, innerH = H - mT - mB;

  const maxAbsDia = Math.max(1, ...data.map(r=>Math.abs(r.dia)));
  const xMax = maxAbsDia * 1.15, xMin = -xMax;
  const xs = v => mL + (v - xMin)/(xMax - xMin) * innerW;
  const ys = v => H - mB - v/100 * innerH;

  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function text(x, y, cls, anchor, str, extra){
    const t = el('text', Object.assign({x, y, class:cls, 'text-anchor':anchor}, extra||{}));
    t.textContent = str;
    return t;
  }

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

  // grid horizontal: RS 0/25/50/75/100
  [0,25,50,75,100].forEach(v=>{
    svg.appendChild(el('line', {x1:mL, x2:W-mR, y1:ys(v), y2:ys(v), class:'bb-grid-line'}));
    svg.appendChild(text(mL-6, ys(v)+3, 'bb-axis-label', 'end', v+'%'));
  });

  // grid vertical: pasos redondos de Día%
  const step = niceStep(xMax);
  for(let v = Math.ceil(xMin/step)*step; v <= xMax; v += step){
    if(Math.abs(v) < step/100) continue; // el 0 lo dibuja el eje
    svg.appendChild(el('line', {x1:xs(v), x2:xs(v), y1:mT, y2:H-mB, class:'bb-grid-line'}));
    svg.appendChild(text(xs(v), H-mB+16, 'bb-axis-label', 'middle', (v>0?'+':'')+v.toFixed(1)+'%'));
  }

  // ejes
  svg.appendChild(el('line', {x1:mL, x2:W-mR, y1:H-mB, y2:H-mB, class:'bb-axis-line'}));
  svg.appendChild(el('line', {x1:xs(0), x2:xs(0), y1:mT, y2:H-mB, class:'bb-axis-line'}));

  // línea de referencia RS >= 90%
  svg.appendChild(el('line', {x1:mL, x2:W-mR, y1:ys(90), y2:ys(90), class:'bb-ref-line'}));
  svg.appendChild(text(W-mR-4, ys(90)-6, 'bb-ref-label', 'end', 'RS ≥ 90%'));

  // títulos de eje
  svg.appendChild(text((mL+W-mR)/2, H-6, 'bb-axis-title', 'middle', 'Variación del Día (%)'));
  const yMid = (mT+H-mB)/2;
  svg.appendChild(text(14, yMid, 'bb-axis-title', 'middle', 'RS_STS%', {transform:`rotate(-90 14 ${yMid})`}));

  // burbujas
  data.forEach(r=>{
    const cx = xs(r.dia), cy = ys(r.rs);
    const dot = el('circle', {cx, cy, r:7, fill: colorRS(r.rs), class:'bb-dot'});
    svg.appendChild(dot);
    const comps = (componentes && componentes[r.ticker]) || [];
    const show = ()=>{
      const dr = dot.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
      let html = `<b>${r.ticker}</b> — ${r.nombre}<br>RS_STS%: <b>${r.rs}%</b> &nbsp; Día: <b>${fmtPct(r.dia)}</b>`;
      if(comps.length){
        html += '<table class="bubble-tip-comps"><thead><tr><th>Componente</th><th>Peso</th><th>Día</th></tr></thead><tbody>' +
          comps.map(c => `<tr><td>${c.ticker}</td><td>${c.peso.toFixed(2)}%</td><td class="${c.change>=0?'up':'down'}">${c.change!=null?fmtPct(c.change):'—'}</td></tr>`).join('') +
          '</tbody></table>';
      }
      tip.innerHTML = html;
      tip.style.display = 'block';
      tip.style.left = (dr.left - wr.left + dr.width/2 + 10) + 'px';
      tip.style.top = (dr.top - wr.top - 10) + 'px';
    };
    dot.addEventListener('mouseenter', show);
    dot.addEventListener('mouseleave', ()=> tip.style.display='none');
  });

  // etiquetas de RS >= 90%, con anti-colisión: si el hueco horizontal ya está
  // ocupado por otra etiqueta, la apila más arriba en vez de superponer el texto.
  const lineH = 12;
  const placed = [];
  data.filter(r=>r.rs>=90).sort((a,b)=> xs(a.dia)-xs(b.dia)).forEach(r=>{
    const cx = xs(r.dia), cy = ys(r.rs);
    const w = r.ticker.length*5.6 + 6;
    let y = cy - 11;
    for(let tries=0; tries<12; tries++){
      const x1 = cx - w/2, x2 = cx + w/2;
      const collide = placed.some(p => x1 < p.x2 && x2 > p.x1 && Math.abs(y - p.y) < lineH);
      if(!collide) break;
      y -= lineH;
    }
    placed.push({x1: cx - w/2, x2: cx + w/2, y});
    svg.appendChild(el('rect', {x:cx-w/2, y:y-9, width:w, height:11, rx:2, fill:'#fff', opacity:'0.85'}));
    svg.appendChild(text(cx, y, 'bb-dot-label', 'middle', r.ticker));
  });
}

  }
  if(Array.isArray(data.resumen) && data.resumen.length){

    renderBubbleMap(data.resumen, data.componentes || {});

    document.getElementById('tab-mapa').innerHTML = '<div class="muted">Sin datos de Resumen.</div>';

  if(Array.isArray(data.paises) && data.paises.length){
    renderPaises(data.paises);
  } else {
    document.getElementById('tab-paises').innerHTML = '<div class="muted">Sin datos de RS por países.</div>';
  }
})();
